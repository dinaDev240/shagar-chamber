<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>News Details | Shagar Chamber</title>

    <meta
        name="description"
        content="Latest news and updates from Shagar Chamber of Commerce & Sectoral Association."
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <!-- Main Stylesheet -->
    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <!-- =====================================================
         HEADER
         ===================================================== -->

    <header id="site-header" class="news-details-header">

        <div class="container">

            <div class="header-inner">

                <a
                    href="index.html"
                    class="logo"
                >
                    Shagar Chamber
                </a>


                <a
                    href="index.html#news"
                    class="news-details-back"
                >
                    <i class="fa-solid fa-arrow-left"></i>
                    Back to News
                </a>

            </div>

        </div>

    </header>


    <!-- =====================================================
         NEWS DETAILS
         ===================================================== -->

    <main>

        <section class="news-details-section">

            <div class="container">

                <div
                    id="news-details-container"
                    class="news-details-container"
                >

                    <div class="news-empty-state">

                        <i class="fa-solid fa-spinner fa-spin"></i>

                        <p>
                            Loading news article...
                        </p>

                    </div>

                </div>

            </div>

        </section>

    </main>


    <!-- =====================================================
         FOOTER
         ===================================================== -->

    <footer class="site-footer">

        <div class="container">

            <div class="footer-bottom">

                <p>
                    &copy;
                    <span id="current-year"></span>
                    Shagar Chamber of Commerce & Sectoral Association.
                    All rights reserved.
                </p>

            </div>

        </div>

    </footer>


    <!-- =====================================================
         NEWS DETAILS JAVASCRIPT
         ===================================================== -->

    <script src="news-details.js"></script>

</body>

</html>
