<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Shagar Chamber | Job Applications</title>

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #1b263b;
        }

        /* =========================================
           HEADER
        ========================================= */

        .admin-header {
            background: #0b1f3a;
            color: white;
            padding: 20px 30px;
        }

        .admin-header-inner {
            max-width: 1200px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .admin-brand {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .admin-logo {
            width: 48px;
            height: 48px;
            background: #d4a72c;
            color: #0b1f3a;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .admin-brand h1 {
            font-size: 22px;
        }

        .admin-brand span {
            display: block;
            margin-top: 4px;
            font-size: 13px;
            color: #d4a72c;
        }

        /* =========================================
           MAIN
        ========================================= */

        .admin-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .page-title {
            margin-bottom: 25px;
        }

        .page-title h2 {
            font-size: 30px;
            color: #0b1f3a;
        }

        .page-title p {
            margin-top: 8px;
            color: #666;
        }

        /* =========================================
           APPLICATIONS CONTAINER
        ========================================= */

        .applications-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .applications-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .applications-header h3 {
            color: #0b1f3a;
        }

        .refresh-btn {
            border: none;
            background: #d4a72c;
            color: #0b1f3a;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .refresh-btn:hover {
            opacity: 0.9;
        }

        /* =========================================
           TABLE
        ========================================= */

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
        }

        th {
            background: #0b1f3a;
            color: white;
            padding: 14px;
            text-align: left;
            font-size: 14px;
        }

        td {
            padding: 14px;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }

        tr:hover {
            background: #fafafa;
        }

        /* =========================================
           STATUS
        ========================================= */

        .status {
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            display: inline-block;
        }

        .status-pending {
            background: #fff3cd;
            color: #856404;
        }

        .status-shortlisted {
            background: #d1ecf1;
            color: #0c5460;
        }

        .status-rejected {
            background: #f8d7da;
            color: #721c24;
        }

        .status-hired {
            background: #d4edda;
            color: #155724;
        }

        /* =========================================
           BUTTONS
        ========================================= */

        .view-btn {
            background: #0b1f3a;
            color: white;
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 5px;
            display: inline-block;
            font-size: 12px;
        }

        .view-btn:hover {
            background: #16365f;
        }

        /* =========================================
           EMPTY / LOADING
        ========================================= */

        .message {
            text-align: center;
            padding: 40px;
            color: #777;
        }
/* =========================================
   APPLICATION DETAILS MODAL
========================================= */

.application-modal {
    display: none;
    position: fixed;
    z-index: 1000;
    inset: 0;
    background: rgba(11, 31, 58, 0.65);
    padding: 30px 20px;
    overflow-y: auto;
}

.application-modal.active {
    display: flex;
    justify-content: center;
    align-items: flex-start;
}

.application-modal-content {
    width: 100%;
    max-width: 850px;
    background: white;
    border-radius: 14px;
    margin: 20px auto;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
}

.application-modal-header {
    background: #0b1f3a;
    color: white;
    padding: 22px 25px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.application-modal-header h2 {
    font-size: 24px;
}

.application-modal-header p {
    margin-top: 5px;
    color: #d4a72c;
    font-size: 14px;
}

.close-modal {
    width: 40px;
    height: 40px;
    border: none;
    border-radius: 50%;
    background: #d4a72c;
    color: #0b1f3a;
    cursor: pointer;
    font-size: 18px;
}

.application-details {
    padding: 30px;
}

.detail-section {
    margin-bottom: 25px;
}

.detail-section h3 {
    color: #0b1f3a;
    font-size: 18px;
    margin-bottom: 15px;
    padding-bottom: 8px;
    border-bottom: 2px solid #d4a72c;
}

.detail-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
}

.detail-item {
    background: #f7f8fa;
    padding: 14px;
    border-radius: 8px;
}

.detail-item strong {
    display: block;
    color: #0b1f3a;
    font-size: 13px;
    margin-bottom: 5px;
}

.detail-item span {
    color: #555;
}

.cover-letter {
    background: #f7f8fa;
    padding: 18px;
    border-radius: 8px;
    line-height: 1.7;
    white-space: pre-wrap;
    color: #444;
}

.application-actions {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 20px;
}

.cv-button {
    background: #0b1f3a;
    color: white;
    padding: 11px 18px;
    border-radius: 6px;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 8px;
}

.cv-button:hover {
    background: #16365f;
}

.status-control {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 15px;
}

.status-control select {
    padding: 10px 14px;
    border: 1px solid #ddd;
    border-radius: 6px;
    font-size: 14px;
}

.save-status-btn {
    border: none;
    background: #d4a72c;
    color: #0b1f3a;
    padding: 10px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}

.save-status-btn:hover {
    opacity: 0.9;
}

@media (max-width: 700px) {

    .application-modal {
        padding: 10px;
    }

    .application-details {
        padding: 20px;
    }

    .detail-grid {
        grid-template-columns: 1fr;
    }

    .application-modal-header h2 {
        font-size: 20px;
    }

}
        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 700px) {

            .admin-header {
                padding: 15px;
            }

            .admin-brand h1 {
                font-size: 18px;
            }

            .admin-container {
                margin-top: 25px;
            }

            .applications-card {
                padding: 15px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         ADMIN HEADER
    ========================================== -->

    <header class="admin-header">

        <div class="admin-header-inner">

            <div class="admin-brand">

                <div class="admin-logo">
                    <i class="fas fa-file-user"></i>
                </div>

                <div>

                    <h1>
                        Shagar Chamber
                    </h1>

                    <span>
                        Job Applications Management
                    </span>

                </div>

            </div>

        </div>

    </header>



    <!-- =========================================
         MAIN CONTENT
    ========================================== -->

    <main class="admin-container">

        <div class="page-title">

            <h2>
                Job Applications
            </h2>

            <p>
                Review and manage applications submitted
                for Chamber job opportunities.
            </p>

        </div>


        <section class="applications-card">

            <div class="applications-header">

                <h3>
                    Applications
                </h3>

                <button
                    class="refresh-btn"
                    id="refreshApplications">

                    <i class="fas fa-rotate"></i>
                    Refresh

                </button>

            </div>


            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>

                            <th>
                                Applicant
                            </th>

                            <th>
                                Job
                            </th>

                            <th>
                                Email
                            </th>

                            <th>
                                Phone
                            </th>

                            <th>
                                Education
                            </th>

                            <th>
                                Status
                            </th>

                            <th>
                                Action
                            </th>

                        </tr>

                    </thead>


                    <tbody id="applicationsTableBody">

                        <tr>

                            <td
                                colspan="7"
                                class="message">

                                Loading applications...

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </section>
<!-- =========================================
     APPLICATION DETAILS MODAL
========================================== -->

<div class="application-modal" id="applicationModal">

    <div class="application-modal-content">

        <div class="application-modal-header">

            <div>
                <h2>Application Details</h2>
                <p>Review applicant information</p>
            </div>

            <button
                type="button"
                class="close-modal"
                id="closeApplicationModal">

                <i class="fas fa-xmark"></i>

            </button>

        </div>


        <div class="application-details" id="applicationDetails">

            <div class="message">
                Loading application...
            </div>

        </div>

    </div>

</div>
    </main>

<script src="admin-job-applications.js"></script>
</body>

</html>
