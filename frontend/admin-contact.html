<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Shagar Chamber / Contact Messages
    </title>


    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >


    <!-- Main Website CSS -->
    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <!-- =====================================================
         ADMIN HEADER
         ===================================================== -->

    <header class="admin-header">

        <div class="admin-header-inner">

            <div class="admin-brand">

                <div class="admin-logo">
                    <i class="fas fa-envelope"></i>
                </div>

                <div>
                    <h1>Shagar Chamber</h1>
                    <span>Contact Management</span>
                </div>

            </div>

            <a
                href="index.html"
                class="admin-back-link"
            >
                <i class="fas fa-arrow-left"></i>
                Back to Website
            </a>

        </div>

    </header>


    <!-- =====================================================
         MAIN
         ===================================================== -->

    <main class="admin-main">

        <div class="admin-container">


            <!-- PAGE HEADING -->

            <div class="admin-page-heading">

                <span class="admin-section-label">
                    <i class="fas fa-envelope"></i>
                    Communication Management
                </span>

                <h2>
                    Contact Message Management
                </h2>

                <p>
                    View and manage messages submitted
                    through the Shagar Chamber website.
                </p>

            </div>


            <!-- =================================================
                 CONTACT MESSAGES
                 ================================================= -->

            <section class="admin-panel">

                <div class="admin-panel-heading">

                    <div>

                        <h3>
                            <i class="fas fa-inbox"></i>
                            Contact Messages
                        </h3>

                        <p>
                            Review messages submitted by website visitors.
                        </p>

                    </div>


                    <button
                        type="button"
                        id="refreshMessages"
                        class="admin-secondary-button"
                    >

                        <i class="fas fa-arrows-rotate"></i>

                        Refresh

                    </button>

                </div>


                <!-- MESSAGES LIST -->

                <div id="admin-contact-messages-list">

                    <div class="admin-loading">

                        <i class="fas fa-spinner fa-spin"></i>

                        Loading messages...

                    </div>

                </div>

            </section>


        </div>

    </main>


    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script src="admin-contact.js"></script>

</body>

</html>
