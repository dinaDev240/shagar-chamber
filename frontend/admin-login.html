<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Shagar Chamber</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

        .login-card {

            border-radius: 18px;

        .logo {
            width: 76px;

            align-items: center;

        h1 {

        }

        .subtitle {
            margin: 10px 0 28px;

<body>
    <main class="login-card">
        <div class="logo">
            <i class="fa-solid fa-building-columns"></i>
        </div>

        <h1>Administrator Login</h1>
        <p class="subtitle">
            Sign in to manage the Shagar Chamber website.
        </p>

        <form id="adminLoginForm">
            <div class="form-group">
                <label for="username">Admin username</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-user"></i>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        autocomplete="username"
                        required>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required>

                    <i
                        class="fa-solid fa-eye toggle-password"
                        id="togglePassword"
                        role="button"
                        tabindex="0"
                        aria-label="Show password"></i>
                </div>
            </div>

            <button class="login-button" type="submit">
                <i class="fa-solid fa-right-to-bracket"></i>
                Sign In
            </button>

            <p id="loginMessage" role="status" aria-live="polite"></p>
        </form>

        <a class="back-link" href="index.html">
            <i class="fa-solid fa-arrow-left"></i>
            Back to website
        </a>
    </main>

    <script>
        // This page expects the frontend and backend to share the same origin.
        const API_BASE = window.location.origin;

        const loginForm = document.getElementById("adminLoginForm");
        const usernameInput = document.getElementById("username");
        const passwordInput = document.getElementById("password");
        const togglePassword = document.getElementById("togglePassword");
        const loginMessage = document.getElementById("loginMessage");
        const loginButton = loginForm.querySelector('button[type="submit"]');

        function togglePasswordVisibility() {
            const hidden = passwordInput.type === "password";

            passwordInput.type = hidden ? "text" : "password";
            togglePassword.classList.toggle("fa-eye", !hidden);
            togglePassword.classList.toggle("fa-eye-slash", hidden);
            togglePassword.setAttribute(
                "aria-label",
                hidden ? "Hide password" : "Show password"
            );
        }

        togglePassword.addEventListener("click", togglePasswordVisibility);

        togglePassword.addEventListener("keydown", function (event) {
            if (event.key === "Enter" || event.key === " ") {
                event.preventDefault();
                togglePasswordVisibility();
            }
        });

        loginForm.addEventListener("submit", async function (event) {
            event.preventDefault();

            const username = usernameInput.value.trim();
            const password = passwordInput.value;

            loginMessage.textContent = "Signing in...";
            loginMessage.style.color = "#64748b";
            loginButton.disabled = true;

            try {
                const response = await fetch(`${API_BASE}/api/admin/login`, {
                    method: "POST",
                    credentials: "include",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });

                const data = await response.json().catch(() => ({}));

                if (!response.ok || !data.success) {
                    throw new Error(
                        data.message || "Login failed. Check your username and password."
                    );
                }

                // The server must authenticate the account.
                // These values are only for displaying account information.
                localStorage.removeItem("shagar_admin");
                sessionStorage.removeItem("shagar_admin");

                if (data.admin) {
                    localStorage.setItem(
                        "shagar_admin",
                        JSON.stringify(data.admin)
                    );
                }

                loginMessage.textContent = "Login successful. Opening dashboard...";
                loginMessage.style.color = "#15803d";

                window.location.href = "admin-dashboard.html";

            } catch (error) {
                console.error("Admin login error:", error);

                loginMessage.textContent =
                    error.message || "Unable to contact the login server.";

                loginMessage.style.color = "#dc2626";
                loginButton.disabled = false;
            }
        });
    </script>
</body>
</html>
