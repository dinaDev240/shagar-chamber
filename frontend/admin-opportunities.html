<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shagar Chamber - Opportunities Management</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         ADMIN HEADER
         ========================= -->

    <header class="admin-header">

        <div class="admin-header-inner">

            <div class="admin-brand">

                <div class="admin-logo">
                    SC
                </div>

                <div>
                    <h1>Shagar Chamber</h1>
                    <span>Opportunities Management</span>
                </div>

            </div>

            <a href="index.html" class="admin-back-link">
                <i class="fas fa-arrow-left"></i>
                Back to Website
            </a>

        </div>

    </header>


    <!-- =========================
         MAIN CONTENT
         ========================= -->

    <main class="admin-main">

        <div class="admin-container">

            <div class="admin-page-heading">

                <span>
                    <i class="fas fa-briefcase"></i>
                    ADMINISTRATION
                </span>

                <h2>
                    Jobs & Opportunities
                </h2>

                <p>
                    Create and manage jobs, business opportunities,
                    training programs and tenders.
                </p>

            </div>


            <!-- =========================
                 CREATE OPPORTUNITY
                 ========================= -->

            <section class="admin-panel">

                <div class="admin-panel-heading">

                    <div>
                        <i class="fas fa-plus-circle"></i>

                        <h3>
                            Add New Opportunity
                        </h3>
                    </div>

                </div>


                <form id="opportunityForm">

                    <div class="admin-form-grid">

                        <div class="admin-form-group">

                            <label for="title">
                                Opportunity Title
                                <span>*</span>
                            </label>

                            <input
                                type="text"
                                id="title"
                                name="title"
                                placeholder="Example: Marketing Manager"
                                required
                            >

                        </div>


                        <div class="admin-form-group">

                            <label for="category">
                                Category
                                <span>*</span>
                            </label>

                            <select
                                id="category"
                                name="category"
                                required
                            >

                                <option value="">
                                    Select category
                                </option>

                                <option value="Job">
                                    Job
                                </option>

                                <option value="Business Opportunity">
                                    Business Opportunity
                                </option>

                                <option value="Training">
                                    Training
                                </option>

                                <option value="Tender">
                                    Tender
                                </option>

                                <option value="Other">
                                    Other
                                </option>

                            </select>

                        </div>


                        <div class="admin-form-group">

                            <label for="organization">
                                Organization
                            </label>

                            <input
                                type="text"
                                id="organization"
                                name="organization"
                                placeholder="Company or organization"
                            >

                        </div>


                        <div class="admin-form-group">

                            <label for="location">
                                Location
                            </label>

                            <input
                                type="text"
                                id="location"
                                name="location"
                                placeholder="Example: Addis Ababa"
                            >

                        </div>


                        <div class="admin-form-group">

                            <label for="contactEmail">
                                Contact Email
                            </label>

                            <input
                                type="email"
                                id="contactEmail"
                                name="contactEmail"
                                placeholder="contact@example.com"
                            >

                        </div>


                        <div class="admin-form-group">

                            <label for="contactPhone">
                                Contact Phone
                            </label>

                            <input
                                type="tel"
                                id="contactPhone"
                                name="contactPhone"
                                placeholder="0912345678"
                            >

                        </div>


                        <div class="admin-form-group">

                            <label for="applicationDeadline">
                                Application Deadline
                            </label>

                            <input
                                type="date"
                                id="applicationDeadline"
                                name="applicationDeadline"
                            >

                        </div>

                    </div>


                    <div class="admin-form-group">

                        <label for="description">
                            Description
                            <span>*</span>
                        </label>

                        <textarea
                            id="description"
                            name="description"
                            rows="5"
                            placeholder="Describe the opportunity..."
                            required
                        ></textarea>

                    </div>


                    <div class="admin-form-group">

                        <label for="requirements">
                            Requirements
                        </label>

                        <textarea
                            id="requirements"
                            name="requirements"
                            rows="4"
                            placeholder="Enter qualifications, requirements or other important information..."
                        ></textarea>

                    </div>


                    <div class="admin-form-actions">

                        <button
                            type="submit"
                            class="admin-primary-button"
                        >

                            <i class="fas fa-plus"></i>

                            Publish Opportunity

                        </button>

                    </div>

                </form>

            </section>


            <!-- =========================
                 EXISTING OPPORTUNITIES
                 ========================= -->

            <section class="admin-panel">

                <div class="admin-panel-heading">

                    <div>

                        <i class="fas fa-list"></i>

                        <h3>
                            Existing Opportunities
                        </h3>

                    </div>

                    <button
                        type="button"
                        id="refreshOpportunities"
                        class="admin-secondary-button"
                    >

                        <i class="fas fa-refresh"></i>

                        Refresh

                    </button>

                </div>


                <div id="admin-opportunities-list">

                    <div class="admin-loading">

                        <i class="fas fa-spinner fa-spin"></i>

                        Loading opportunities...

                    </div>

                </div>

            </section>

        </div>

    </main>


    <script src="admin-opportunities.js"></script>

</body>

</html>
